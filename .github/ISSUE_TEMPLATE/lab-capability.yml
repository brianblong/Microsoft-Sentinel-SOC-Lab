name: Lab capability
description: Plan a new infrastructure, telemetry, detection, or automation capability.
title: "[Capability]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What capability or learning outcome will this deliver?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and cost considerations
      description: Include isolation, secrets, data exposure, Azure cost, and rollback risks.
    validations:
      required: true
  - type: input
    id: sc200
    attributes:
      label: SC-200 relationship
      description: Identify the relevant skills-measured area, if applicable.
  - type: input
    id: attack
    attributes:
      label: MITRE ATT&CK relationship
      description: List applicable tactic, technique, and sub-technique identifiers.

